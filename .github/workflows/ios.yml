name: wolphun iOS armv7 (Mophun emulator, iOS 7.0+)

# SINGLE-FILE VERSION: whole project embedded as base64 tar.xz; commit only this file to .github/workflows/.
# Toolchain steps (Theos + L1ghtmann vanilla clang with 32-bit ARM, libc++ __config_site fix,
# iPhoneOS 9.3 SDK, module-map fix) are the ones from ioskvm's ios.yml, minus JDK/freetype/phoneME.
# Unsigned build: sign it with your own Apple ID (Sideloadly, AltStore, Cydia Impactor) or install the
# .deb on a jailbroken device.

on:
  push:
  workflow_dispatch: {}

env:
  IOS_SDK_VERSION: "9.3"
  IOS_DEPLOY_TARGET: "7.0"

jobs:
  build-ios-armv7:
    name: Build (Theos / iOS 7.0+ / armv7)
    runs-on: ubuntu-24.04      # the L1ghtmann toolchain needs glibc >= 2.38
